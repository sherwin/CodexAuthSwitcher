<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Surface Codex 账号</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182635;font:16px system-ui}main{max-width:440px;margin:10vh auto;padding:24px}form{background:#fff;border:1px solid #dce3e9;border-radius:14px;padding:24px}h1{font-size:25px}p{line-height:1.6;color:#536472}label{display:block;margin:18px 0}input,button{width:100%;font:inherit;padding:12px;border:1px solid #bccbd4;border-radius:8px}input{margin-top:8px}button{background:#176b57;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#message{min-height:26px;color:#a22}
</style>
<main><form id="login"><h1>Surface · Codex 账号</h1><p>输入管理账号登录，授权文件保存在 Surface。</p><label>用户名<input name="username" autocomplete="username" value="admin" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="message" role="status"></p></form></main>
<script>
document.getElementById('login').onsubmit=async event=>{
    event.preventDefault();const form=event.target,button=form.querySelector('button'),message=document.getElementById('message');
    button.disabled=true;message.textContent='正在登录…';
    try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Switcher-Web':'1'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});
        if(!response.ok)throw Error(response.status===429?'尝试次数过多，请一分钟后重试':'用户名或密码不正确');
        location.replace('/');
    }catch(error){message.textContent=error.message}finally{button.disabled=false}
};
</script></html>
