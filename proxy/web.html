<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface · Codex 账号</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182635;font:16px system-ui}main{max-width:980px;margin:48px auto;padding:0 22px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:30px;margin:8px 0}p{line-height:1.7;color:#536472}button,.upload{background:#176b57;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e7edf1;color:#243c4c}.box,article{background:white;border:1px solid #dce3e9;border-radius:14px;padding:22px;margin:18px 0}#state{white-space:pre-line}#message{position:sticky;top:0;background:#e8f1ec;padding:12px;border-radius:8px;min-height:44px}h2{font-size:20px;margin:0 0 12px;overflow-wrap:anywhere}.buttons{display:flex;gap:10px;flex-wrap:wrap}.usage{white-space:pre-wrap;overflow-wrap:anywhere;color:#425567;font-size:14px}input{max-width:100%}.tag{font-size:13px;color:#176b57}footer{font-size:13px;color:#667}@media(max-width:600px){main{margin:22px auto}header{align-items:flex-start;flex-direction:column}}
</style><main><header><div><span class="tag">SURFACE / CODEX AUTH SWITCHER</span><h1>Codex 账号管理</h1><p>账号文件保存在 Surface，本页不显示访问令牌。</p></div><button id="refresh">刷新列表</button></header><div id="message" role="status">正在连接…</div><section class="box"><h2>当前连接</h2><p id="state"></p><button id="keymode" class="secondary">将 Codex 连接到本地代理</button><p>代理模式下切换出口后，新请求立即使用新账号。首次配置需重启 Codex。授权文件切换只影响新启动的 Codex；先停止正在执行的任务。</p></section><section class="box"><h2>导入账号</h2><input id="files" type="file" accept=".json" multiple><button id="import">上传授权文件</button><p>仅上传你自己的 ChatGPT 授权 JSON。文件只发送到这台 Surface，同名文件不会被覆盖。</p></section><div id="accounts"></div><footer>仅用于可信局域网。HTTP 未加密，请勿映射到公网。</footer></main>
<script>
const $=x=>document.getElementById(x);let busy=false;
async function api(route,data){const r=await fetch('/api/'+route,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Switcher-Web':'1'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('message').textContent='操作失败：'+e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const [s,a]=await Promise.all([api('status'),api('accounts')]);$('state').textContent='服务：运行中\n连接模式：'+s.codex_mode+'\n代理出口：'+(s.selected_file||'未选择')+'\nCodex 授权文件：'+(s.codex_auth_file||'当前文件')+'\n授权目录：'+a.authDirectory;$('accounts').replaceChildren();for(const x of a.accounts){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),buttons=document.createElement('div'),u=document.createElement('div');h.textContent=x.name;p.textContent=(x.active?'当前代理出口 · ':'')+'更新：'+new Date(x.modifiedAt).toLocaleString();buttons.className='buttons';u.className='usage';for(const [label,route]of [['查看额度','usage'],['切换代理出口','select'],['切换 Codex 授权文件','auth-file']]){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=()=>action(async()=>{if(route==='auth-file'&&!confirm('确认已停止 Codex 任务？切换后需新建 Codex 会话。'))return;const j=await api(route,{name:x.name});if(route==='usage')u.textContent=JSON.stringify(j,null,2);else{await load();$('message').textContent='已完成：'+label+' → '+x.name}});buttons.append(b)}card.append(h,p,buttons,u);$('accounts').append(card)}$('message').textContent='已连接 · '+a.accounts.length+' 个账号'}
$('refresh').onclick=()=>action(load);$('keymode').onclick=()=>action(async()=>{if(!confirm('应用代理模式并备份配置？请先停止 Codex 任务。'))return;await api('configure',{});await load();$('message').textContent='已应用代理模式，请新建 Codex 会话'});$('import').onclick=()=>action(async()=>{for(const f of $('files').files)await api('import',{name:f.name,auth:await f.text()});$('files').value='';await load();$('message').textContent='导入完成'});action(load);
</script></html>
